    <fieldset>
        <legend>Tee oma valik</legend>
    <input type="checkbox" id="java" name="valik" value="Java" onchange="teeValik()">

    <br>
    <input type="checkbox" id="javascript" name="valik" value="JavaScript" onchange="teeValik()" >
    <label for="javascript">JavaScript</label>
    <br>
    <input type="checkbox" id="python" name="valik" value="Python" onchange="teeValik()">
    <label for="python">Python</label>
    <br>
    <input type="checkbox" id="php" name="valik" value="PHP" onchange="teeValik()">
